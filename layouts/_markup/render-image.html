{{- /* Image render hook: resolve bundle resources, downscale to <=1200px and
       re-encode to WebP q85, and wrap in a captioned <figure>.

       Alt text and caption are separate concerns and want different lengths.
       Alt describes the picture for someone who cannot see it; the caption says
       why the picture is here. So:

         ![alt text](file.png "Caption")   alt = alt text, caption = Caption
         ![alt text](file.png)             alt = alt text, caption = alt text
         ![](file.png)                     bare image, no caption (decorative)

       The two-argument form lets alt stay properly descriptive while the caption
       stays short. The single-argument form is the original behaviour and is
       unchanged, so existing posts render exactly as before.

       External/unresolved images pass through untouched. */ -}}
{{- $u := urls.Parse .Destination -}}
{{- $src := $u.String -}}
{{- $w := 0 -}}
{{- $h := 0 -}}
{{- if not $u.IsAbs -}}
  {{- $path := strings.TrimPrefix "./" $u.Path -}}
  {{- $res := or (.PageInner.Resources.Get $path) (resources.Get $path) -}}
  {{- with $res -}}
    {{- /* SVG has ResourceType "image" but is not rasterisable: .Width/.Resize
           both fail on it. Vector diagrams therefore pass straight through and
           scale via their own viewBox. */ -}}
    {{- if and (eq .ResourceType "image") (ne .MediaType.SubType "svg") -}}
      {{- $tw := cond (gt .Width 1200) 1200 .Width -}}
      {{- $i := .Resize (printf "%dx webp q85" $tw) -}}
      {{- $src = $i.RelPermalink -}}
      {{- $w = $i.Width -}}
      {{- $h = $i.Height -}}
    {{- else -}}
      {{- $src = .RelPermalink -}}
    {{- end -}}
  {{- else -}}
    {{- /* A local image that doesn't resolve to a bundle resource would ship as a
           silently broken <img>. Fail the build instead: a typo'd or missing image
           file should never reach the live site unnoticed. */ -}}
    {{- errorf "render-image: %q in %q did not resolve. Check the filename and that the file sits next to index.md in the page bundle." .Destination .Page.Path -}}
  {{- end -}}
{{- end -}}
{{- $caption := or .Title .Text -}}
<figure class="post-figure">
  <img src="{{ $src }}"{{ with .Text }} alt="{{ . }}"{{ end }} loading="lazy" decoding="async"{{ if $w }} width="{{ $w }}" height="{{ $h }}"{{ end }}>
  {{- with $caption }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
