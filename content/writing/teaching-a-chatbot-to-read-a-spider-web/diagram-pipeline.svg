<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="100%" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">Flattening the graph into cards, once, up front</title>
  <desc id="pipeDesc">A six-step flow. Start from the knowledge graph of dots and threads. For each dot, gather all its threads. Write a plain-text entity card. Clean the text by stripping markup. Store each card as one whole document. Vector search then answers questions. The graph work happens once, at build time, so every later question is simple.</desc>

  <style>
    .paper  { fill: #E9E5D6; }
    .box    { fill: #E9E5D6; stroke: #1E3A32; stroke-width: 2; }
    .boxend { fill: #BC3B5C; stroke: #1E3A32; stroke-width: 2; }
    .flow   { stroke: #47695B; stroke-width: 2.5; fill: none; }
    .step   { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
              font-size: 18px; fill: #1E3A32; text-anchor: middle; }
    .stepw  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
              font-size: 18px; fill: #E9E5D6; text-anchor: middle; }
    .num    { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
              font-size: 13px; fill: #7D8F6F; text-anchor: middle; }
    .phase  { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
              font-size: 13px; fill: #7D8F6F; letter-spacing: 0.08em; }
  </style>

  <rect class="paper" x="0" y="0" width="720" height="310"/>

  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#47695B"/>
  </marker>

  <text class="phase" x="20" y="26">ONCE, AT BUILD TIME</text>

  <!-- row one -->
  <g>
    <rect class="box" x="20"  y="42" width="190" height="74" rx="8"/>
    <text class="num"  x="115" y="62">01</text>
    <text class="step" x="115" y="85">Knowledge graph</text>
    <text class="step" x="115" y="105">dots and threads</text>

    <rect class="box" x="265" y="42" width="190" height="74" rx="8"/>
    <text class="num"  x="360" y="62">02</text>
    <text class="step" x="360" y="85">For each dot,</text>
    <text class="step" x="360" y="105">gather its threads</text>

    <rect class="box" x="510" y="42" width="190" height="74" rx="8"/>
    <text class="num"  x="605" y="62">03</text>
    <text class="step" x="605" y="85">Write a plain-text</text>
    <text class="step" x="605" y="105">entity card</text>
  </g>

  <line class="flow" x1="212" y1="79" x2="261" y2="79" marker-end="url(#arrow)"/>
  <line class="flow" x1="457" y1="79" x2="506" y2="79" marker-end="url(#arrow)"/>

  <!-- wrap from the end of row one to the start of row two -->
  <path class="flow" d="M 605 118 L 605 145 L 115 145 L 115 189" marker-end="url(#arrow)"/>

  <!-- row two -->
  <g>
    <rect class="box" x="20"  y="192" width="190" height="74" rx="8"/>
    <text class="num"  x="115" y="212">04</text>
    <text class="step" x="115" y="235">Clean the text</text>
    <text class="step" x="115" y="255">strip the markup</text>

    <rect class="box" x="265" y="192" width="190" height="74" rx="8"/>
    <text class="num"  x="360" y="212">05</text>
    <text class="step" x="360" y="235">Store one card</text>
    <text class="step" x="360" y="255">per entity</text>

    <rect class="boxend" x="510" y="192" width="190" height="74" rx="8"/>
    <text class="num"   x="605" y="212" fill="#E9E5D6">06</text>
    <text class="stepw" x="605" y="235">Vector search</text>
    <text class="stepw" x="605" y="255">answers questions</text>
  </g>

  <line class="flow" x1="212" y1="229" x2="261" y2="229" marker-end="url(#arrow)"/>
  <line class="flow" x1="457" y1="229" x2="506" y2="229" marker-end="url(#arrow)"/>

  <text class="phase" x="510" y="292">EVERY TIME, AT QUESTION TIME</text>
</svg>
