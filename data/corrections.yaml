- date: "2026-09-27"
  where: "promptlsh — RESULTS.md §2"
  what: "Presented a 2.9x figure (35.1% against 12.2%) under the heading \"Cross-org correlation\"."
  fix: "The measurement is real but the label was wrong. The two \"organisations\" were random halves of a single high-redundancy competition corpus, so they shared wording by construction: it measures the gap between exact and fuzzy matching on closely related material, not a cross-organisation rate. The section is now titled \"Fuzzy vs exact matching on shared source material\" and says so explicitly. A genuine cross-feed measurement across five independently collected corpora is reported separately in §2b, and it is far more sobering — essentially zero on literal text."

- date: "2026-09-27"
  where: "promptlsh — RESULTS.md §3"
  what: "Told readers the evaluation scripts were in eval/, when the central int8-quantisation comparison was only ever in an uncommitted scratch script."
  fix: "No figure was wrong, but nobody could reproduce the number the whole post pivots on. The comparison is now eval/wire_formats.py with fixed seeds, and re-running it reproduces every bge-small figure exactly."
- date: "2026-09-28"
  where: "Writing — \"Every Attack Here Is a Prompt Injection\" (published briefly under a different title)"
  what: "Led on the claim that fewer than one in six successful prompt attacks maps to MITRE ATLAS or the OWASP LLM Top 10, and defended it by arguing that the unclassifiable attacks were too short to carry a technique."
  fix: "Both were wrong, and a reviewer caught them within hours of publication. HackAPrompt is a prompt-injection competition: the dataset records one fixed scoring target, \"I have been PWNED\", on ten of its eleven levels, so every successful attack is AML.T0051 by construction. What I had measured was my own detector's sub-technique recall, not whether the attacks fit the taxonomy. The length argument was backwards — any keyword detector fires more often on longer text, and a control pattern with no meaning at all (the word \"the\") reproduces a wider gap than the one I presented as evidence. The post was pulled the same day, and rewritten around what the corpus can actually support: because the correct label is known in advance, this is a rare chance to measure attribution against ground truth, and keyword attribution over prompt text recovers 11.4% of it. The rewrite also applies the challenge-design confound to the 2023 data, which the original only applied to 2025 — 93.4% of the translation signature comes from the four levels built around Spanish translation. Both findings and the control are now reproducible from eval/corpus_construction_check.py. Worth noting how this got through: every number in the original was correct and had been independently re-derived, which is exactly why an arithmetic check passed it. The framing on top of the numbers was the broken part, and all three errors were answerable from columns already sitting in the dataset."
- date: "2026-09-28"
  where: "Writing — \"Cozy Bear, The Dukes, and APT29 Walk Into a Database\""
  what: "Published two exact merge counts (317 and 59) that no saved output supported, and stated that the strict first pass produced no mistakes I could find — inviting the reader to conclude the whole matcher was that clean."
  fix: "Both were wrong in different ways. The counts existed only in an internal planning document; re-running the matcher over an export reproduced neither, because the figure moves with the corpus and nothing had been captured alongside it. They are now described as a few hundred and a few dozen, which is all the article needs. The second problem was the real one: reading the output pair by pair for the first time showed that ten of the fifty-six fuzzy matches were false, an 18% false positive rate in the tier I had described as cautious. Two merged different countries' state apparatus — the DPRK with China's PLA Strategic Support Force on the token \"peoples\", and Iran's Ministry of Intelligence and Security with China's Ministry of State Security on \"ministry\". The cause was a stop-list built by token frequency, which is structurally blind to vocabulary colliding in exactly two records, which is precisely what the uniqueness rule requires; and to ordinary institutional English, which never looked like threat-intelligence vocabulary. Geopolitical and institutional terms are now excluded, placeholder names such as \"Unknown\" cannot match on any tier, and a regression test asserts each of the ten pairs stays apart. The legitimate merges are unchanged. The article now carries the audit rather than the clean record, because the audit is the more useful thing to have read. Worth naming the root cause plainly: I had reasoned about the failure mode correctly and written it up, and had never once read the matcher's actual output."
