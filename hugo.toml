baseURL = "https://ashwinviswamithiran.com/"
locale = "en-us"
title = "Ashwin Viswamithiran"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  description = "Security engineer working on threat intelligence platforms, detection pipelines, and security data infrastructure. Decision records and measurements."
  images = ["og-default.png"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  # Home writing list is rendered by layouts/index.html from this section.
  mainSections = ["writing"]
  # Contact details, used by the home link row, About, and the footer.
  email = "ashwinvis98@gmail.com"
  resume = "/Ashwin-Viswamithiran-Resume.pdf"
  github = "https://github.com/ashwinvis98"
  linkedin = "https://www.linkedin.com/in/ashwinviswamithiran/"

[params.assets]
  favicon = "favicon.svg"

# Home masthead: positioning statement (Title) + caption (Content).
# Rendered by the home_info.html override, called from layouts/index.html.
[params.homeInfoParams]
  Title = "I build the engineering that lets organizations get ahead of attacks."
  Content = "I'm Ashwin, a security engineer in Denver. I build the platforms, data pipelines and automation behind a threat research team, so that what it learns about adversaries reaches our defenses without anyone carrying it over by hand. I also look for where AI can make that work faster and more dependable. I write here about the decisions behind that work, including the ones I got wrong."

