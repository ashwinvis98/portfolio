baseURL = "https://ashwinviswamithiran.com/"
languageCode = "en-us"
title = "Ashwin Viswamithiran"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  description = "Security engineer working on threat intelligence platforms, detection pipelines, and security data infrastructure. Decision records and measurements."
  images = ["og-default.png"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  # Home writing list is rendered by layouts/index.html from this section.
  mainSections = ["writing"]

# Home masthead: positioning statement (Title) + caption (Content).
# Rendered by the home_info.html override, called from layouts/index.html.
[params.homeInfoParams]
  Title = "I build systems that make security teams effective."
  Content = "Threat intelligence platforms, detection pipelines, and security automation. Currently building a CTI platform and threat research program from scratch. Previously: a 120TB SIEM migration, detection content, and SOC transition work."

[[menu.main]]
  name = "writing"
  url = "/writing/"
  weight = 1
[[menu.main]]
  name = "projects"
  url = "/projects/"
  weight = 2
[[menu.main]]
  name = "corrections"
  url = "/corrections/"
  weight = 3
[[menu.main]]
  name = "about"
  url = "/about/"
  weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]
